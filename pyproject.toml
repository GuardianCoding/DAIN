[project]
name = "dain"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "fastembed>=0.8.0,<0.9",
    "httpx>=0.28.1",
    "psutil>=7.2.2",
    "zeroconf>=0.150.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]
[tool.pytest.ini_options]
pythonpath = ["."]

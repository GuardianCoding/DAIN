# cluster.toml — cluster-wide settings that are NOT node identity.
#
# There are deliberately no IP addresses in this file. Nodes discover the
# control plane over mDNS, register themselves, and are addressed by whatever
# they reported at join. A node that appears mid-demo is a first-class case, not
# an exception, and a node that vanishes must not leave a stale address behind.
#
# Where addresses actually live:
#   runtime   -> the control plane registry (GET /api/nodes), keyed by node id
#   planning  -> nowhere; see [[planning.nodes]] below, which has no addresses
#
# One hard constraint this file cannot change: llama.cpp fixes its --rpc
# endpoint list when llama-server starts. Expanding or contracting the pool
# therefore means re-plan + restart the head, which is what [membership]
# is tuned for.

[discovery]
# Lachlan's NODE-2. A node joins with no arguments at all.
mdns_service = "_dain._tcp.local."
# Ports are conventions, not addresses — every node uses the same ones.
rpc_port   = 50052
ctl_port   = 8000
node_port  = 9100
llama_port = 8080
# Which NIC a node binds its RPC server to, resolved on the node itself.
# rpc-server has NO authentication, so this must never resolve to a routable
# or wireless interface. Set per node; unset means "the interface that has a
# route to the control plane".
bind_interface_env = "DAIN_FABRIC_IFACE"
pool_secret_env    = "DAIN_POOL_SECRET"   # name only. Never commit the value.

[membership]
# How the pool expands and contracts.
heartbeat_interval_s      = 2
missed_heartbeats_offline = 3    # 3 misses ~= 6 s to declare a node gone
# Do not restart the head the instant one node flaps. A cable that is half out
# will otherwise thrash llama-server in a loop for the whole demo.
replan_debounce_s = 5
# The head alone is a valid cluster. Never block on a quorum.
min_workers = 0
# How long a draining node keeps serving before it is cut loose.
drain_grace_s = 10

# Every node is Linux, so there is ONE set of paths. gpu-02 reaches these paths
# through WSL2, where /srv and /opt are the WSL filesystem — never anything
# under /mnt/c. A weights file on /mnt/c is read across the 9p bridge at a
# fraction of native speed, and mmap of a GGUF there is worse than that.
#
# What must be IDENTICAL across nodes is the llama.cpp commit, not the path.
[paths]
models  = "/srv/dain/models"
llama   = "/opt/dain/llama.cpp/build/bin"
scratch = "/var/tmp/dain"

[llama]
# INF-1. The invariant that prevents the silent RPC handshake hang is the
# COMMIT — llama.cpp's RPC wire protocol has no version negotiation, so two
# nodes built from different commits connect happily and then hang or return
# noise.
#
#   Acceptance test:
#     every node reports this commit from `llama-server --version`.
#
# Now that all five nodes are Linux x86-64, the checksum test the brief wanted
# IS possible on the worker binary: every machine built from build_flags_worker
# should hold a byte-identical rpc-server. scripts/distribute_llama.sh checks
# the commit on all five and the checksum on the four that share a build.
pinned_commit = "UNVERIFIED"

# TWO builds from ONE commit, not one build for five nodes.
#
# GGML_NATIVE defaults to ON and adds -march=native. gpu-01 is Zen 5 and has
# AVX-512; office-01/02 are Skylake and nuc-01 is Kaby Lake, which have AVX2 and
# no AVX-512. Build on gpu-01 with the default, copy the binary, and it dies
# with SIGILL on the first tensor op — a crash that reads like a corrupt model
# file and wastes an evening. GGML_NATIVE=OFF plus explicit ISA flags is what
# makes one build copyable to four machines.
#
# BUILD_SHARED_LIBS=OFF on the worker build so distribution is a plain file copy
# with no libggml-*.so to chase.
build_flags_head   = "-DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=120 -DGGML_RPC=ON -DGGML_NATIVE=ON"
build_flags_worker = "-DGGML_RPC=ON -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_CUDA=OFF -DGGML_VULKAN=OFF -DBUILD_SHARED_LIBS=OFF"

[wsl]
# gpu-02 only. Two host-side settings, both in %USERPROFILE%\.wslconfig on the
# Windows side, neither of which this repo can apply for you. Get them wrong and
# the failure looks like a firewall problem that no firewall change fixes.
#
# 1. networkingMode. WSL2 defaults to NAT: the VM gets a 172.x address behind a
#    virtual switch that multicast does not cross. mDNS join therefore never
#    happens and gpu-02 is invisible to discovery. Mirrored mode puts WSL
#    directly on the host's LAN interface, and is the only mode this design
#    works under.
#
# 2. memory. WSL2 claims 50% of host RAM by default — 8 GB of gpu-02's 16 GB.
#    Set it explicitly and leave the Windows host ~5 GB.
#
#   [wsl2]
#   networkingMode=mirrored
#   memory=11GB
#
# Then, in an ADMIN PowerShell on gpu-02 (one time), open the Hyper-V firewall
# for the WSL VM — mirrored mode still drops inbound RPC without it:
#   Set-NetFirewallHyperVVMSetting -Name '{40E0AC32-46A5-438A-A0B2-2B479E8F2E90}' -DefaultInboundAction Allow
#
# scripts/inventory.sh checks both of these from inside WSL and says so.
required_networking_mode = "mirrored"
memory_gb                = 11

# ---------------------------------------------------------------------------
# Planning fixture — OFFLINE WHAT-IF ONLY.
#
# This exists so capacity questions ("which models are worth downloading?") can
# be answered before any node has joined. It carries no addresses and nothing
# at runtime reads it: infer/memory.py takes live NodeProfiles from the
# registry, and only falls back here when explicitly asked for a planning run.
#
# These are ESTIMATES until scripts/inventory.sh has run on the machine.
# capacity_report() refuses to bless a claim built from unverified numbers.
# ---------------------------------------------------------------------------

[[planning.nodes]]
id       = "gpu-01"
machine  = "Ryzen 5 9600X + RTX 5070 Ti"
ram_mb   = 65536
vram_mb  = 16384
backend  = "cuda"          # Blackwell needs a recent CUDA toolkit; Vulkan is the fallback
os_class = "linux-desktop"
verified = false

[[planning.nodes]]
id       = "gpu-02"
machine  = "Ryzen 5 + RX 5700 XT (card unusable under WSL2 — see below)"
# ram_mb is the WSL2 VM's allocation, not the host's 16 GB, because that is what
# /proc/meminfo reports inside WSL and therefore what the node self-reports at
# join. Set [wsl].memory_gb to match, or this fixture and the live profile
# disagree and the planner oversizes gpu-02's slice.
ram_mb   = 11264
# Zero, and this is the cost of the WSL decision. WSL2 exposes the GPU as
# /dev/dxg (D3D12), so Vulkan means Mesa's dzn layer, which llama.cpp's Vulkan
# backend does not run reliably on. ROCm-in-WSL covers gfx1100+ only and the
# 5700 XT is RDNA1/gfx1010. The 8 GB of VRAM is simply not reachable from here.
# Dual-booting native Linux on this box is what gets it back (RADV on RDNA1 is
# fine) — worth doing if the pool ever needs the headroom.
vram_mb  = 0
backend  = "cpu"
os_class = "linux-wsl"
verified = false

[[planning.nodes]]
id       = "office-01"
machine  = "i7-6700"
ram_mb   = 8192
vram_mb  = 0
backend  = "cpu"
os_class = "linux-headless"
verified = false

[[planning.nodes]]
id       = "office-02"
machine  = "i7-6700 — CONTROL GROUP, keep identical to office-01"
ram_mb   = 8192
vram_mb  = 0
backend  = "cpu"
os_class = "linux-headless"
verified = false

[[planning.nodes]]
id       = "nuc-01"
machine  = "i3-7100U"
ram_mb   = 4096
vram_mb  = 0
backend  = "cpu"
# Headless leaves ~3.2 GiB usable here; a graphical session costs ~1.7 GiB of
# that. This node is 0.9 GiB above the 4B replica threshold, so that session is
# the difference between it holding a replica and sitting out the fan-out demo.
# Never start a desktop on it.
os_class = "linux-headless"
verified = false

# Power, for five compute nodes (the brief assumed four): gpu-01 ~320 W,
# gpu-02 ~300 W, office pair ~190 W, nuc ~45 W, laptops/monitor/switch ~360 W
# => ~1215 W = 5.3 A. Inside one 10 A circuit, but split across two outlets.
